<ion-header class="transparent-header">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="end">
      <!-- Botão para remover o documento -->
      <ion-button (click)="removeDocument()" color="danger">
        <ion-icon name="trash" slot="icon-only"></ion-icon>
      </ion-button>

      <!-- Botão para fechar o modal -->
      <ion-button (click)="dismissModal()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="document-container">
  @if (safeDocumentUrl) {
  <!-- O iframe carrega o documento (PDF, DOCX). PDF funciona nativamente na maioria dos browsers. -->
  <iframe
    [src]="safeDocumentUrl"
    title="Pré-visualização do Documento"
    class="preview-document"
    type="application/pdf"
    aria-label="Pré-visualização do Documento"
  >
    Seu navegador não pode exibir este documento diretamente.
  </iframe>
  } @else {
  <div class="error-message ion-padding">
    <ion-icon name="alert-circle-outline" size="large"></ion-icon>
    <p>
      Não foi possível carregar a pré-visualização do documento. Tente abrir o
      arquivo em outro aplicativo.
    </p>
  </div>
  }
</div>
