<ion-header class="ion-no-border transparent-header">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="end">
      <!-- Botão para remover o vídeo -->
      <ion-button (click)="removeVideo()" color="danger">
        <ion-icon name="trash" slot="icon-only"></ion-icon>
      </ion-button>

      <!-- Botão para fechar o modal -->
      <ion-button (click)="dismissModal()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="video-modal-content">
  <div class="video-container">
    <video
      [src]="videoUrl"
      preload="metadata"
      alt="Video Preview"
      class="preview-video"
      controls
      autoplay
      muted="true"
      loop="true"
      aria-label="Pré-visualização do Vídeo"
    ></video>
  </div>
</ion-content>
